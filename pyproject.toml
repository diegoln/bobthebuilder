[project]
name = "bobthebuilder"
version = "0.0.1"
description = "AI-assisted designer for LEGO MINDSTORMS EV3 robots"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]

[project.scripts]
bob = "bobthebuilder.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bobthebuilder"]
